#
# f5e_intercept — the pack's first mission: a BFM engagement, F-5E vs MiG-21bis.
#
# THE AGGRESSOR FINALLY HAS ITS ADVERSARY (#41). This mission shipped as F-5E vs F-5E because
# the pack had no red-air airframe — "the aggressor is its own adversary" (#24) — and the F-5E
# was chosen in the first place because it was the jet that STOOD IN for the MiG-21 at aggressor
# squadrons. With the MiG-21bis in the pack, red air is a red airframe: a tailed delta with the
# RP-22, two R-60Ms and a GSh-23L against the Tiger's trapezoid wing, APQ-159, two AIM-9Ps and
# 20 mm — the same fight the aggressor school was rehearsing, flown for real. Both sides run the
# SAME ai/fighter.lua (the 0=gun/1=IR station contract): the asymmetry is the airframes, which
# is the whole point.
#
# WIN ON THE KILL: Epic fighters-legacy#583 landed the fire path, so the F-5E's gun and AIM-9P are
# real ordnance and the bandit can be shot down. Success is `on: destroy(bandit1)`, evaluated live
# each tick by the mission trigger runtime (engine #632, shipped in v0.3.2).
#
# RUNWAY START: the player begins PARKED on the builtin airfield's runway (engine #699/#486, in
# v0.3.8) — idle throttle, zero airspeed, held stable until rotation (engine #885). The runway
# needs NO pack terrain: `builtin:airfield` is compiled into the engine (2500 x 45 m asphalt,
# heading 090, field elevation FIXED at 550 m) and the terrain is flattened under it on both the
# physics floor and the visible mesh. Pack terrain (#2/#9) adds a real theater later; a pack
# airfield is #18.
#
# MAP: `world` is the canonical terrain id — a theater pack overrides individual tiles at higher
# mod priority, it never replaces the world (a `terrain/earth` tree would resolve to NOTHING).
# `map:` is parsed but not yet consumed engine-side; validate-mission checks structure, not asset
# existence.

name: "Tiger by the Tail"
map: world
layer: world_clear
time: { hour: 9, minute: 30 }
wind: { heading: 250, speed: 6 }
weather:
  preset: partly_cloudy
time_scale: 1.0        # real-time: this is a training engagement, not a campaign transit

sides: [blue, red]

objects:
  # Player: F-5E, combat-configured exactly as the flight model was calibrated —
  # 2x AIM-9 on the tip rails, full 20 mm, clean pylons (the entity def's default loadout).
  #
  # `player: true` makes this a JOINABLE PLAYER SLOT (engine #854): the connecting pilot binds to it
  # and inherits its faction, spawn and aircraft. WITHOUT it, the human gets a default spawn and this
  # object spawns as a world entity — and since it has no `ai:`, the single-player lifecycle (#634)
  # auto-attaches the entity's default fighter.lua, so the intended player jet would fly itself.
  #
  # `start: ground` (engine #885) parks the jet on the surface, and no `alt:` on purpose: a ground
  # start takes its height from the terrain, so an altitude stated here would be a lie.
  #
  # The spawn is the builtin airfield's runway threshold: the field sits at worldXZ (4000, 0)
  # (BuiltinAirport.h), where local east — runway heading 090 — points along world -Z, so the
  # 2500 m runway runs z = +1250 .. -1250 at x = 4000. Parking at z = 1200 leaves 2450 m of
  # asphalt ahead, and heading 90 faces down the centerline (the engine's demo-atc-scramble
  # mission traces the same geometry).
  - type: fl-base:f5e
    id: player1
    side: blue
    pos: [4000, 0, 1200]
    heading: 90
    player: true
    start: ground

  # Adversary: the MiG-21bis, AI-flown. No `ai:` on purpose — the #634 auto-detect attaches the
  # entity's own default script (entities/mig21bis.toml → ai/fighter.lua, unforked). It patrols its
  # anchor until its OWN sensors find the player — the RP-22 cone or the eyeball, whichever gets
  # there first. Nobody in this mission gets ground truth, and the bis's short-legged radar and
  # flare-less airframe are its honest handicaps (entities/mig21bis.toml).
  #
  # The bandit stays AIRBORNE: fighter.lua has no takeoff logic, and the #885 parking hold waits for
  # a pilot to rotate. It spawns at cruise airspeed along its heading (the #883 default — no `speed:`
  # needed; the delta's stall speed makes a `speed:` mandatory only for HEAVY types, per the B-1B
  # rule), so the engagement develops while the player climbs out.
  - type: fl-base:mig21bis
    id: bandit1
    side: red
    pos: [22000, 0, 18000]
    alt: 4500
    heading: 225

triggers:
  # Win by killing the bandit -- the whole point of a BFM engagement, now that kills are real.
  - on: destroy(bandit1)
    do: mission_success

  # Losing your own aircraft still loses the fight. An UNOCCUPIED slot is not "destroyed"
  # (engine #884), so this cannot fire before a pilot has even joined.
  - on: destroy(player1)
    do: mission_failure
