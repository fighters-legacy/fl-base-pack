# Rockwell B-1B Lancer — flight model
#
# The pack's first bomber, its first variable-geometry aircraft, and the host airframe for
# `ai/bomber.lua` (fl-base-pack#6). Provenance for EVERY number is in SOURCES.md, tagged
# [P] published / [D] derived / [E] estimate.
#
# The lift table, sweep scales, inertias, moment derivatives and both thrust decks are generated by
# derive.py -- do not hand-edit them. Re-run `python3 aircraft/b1b/derive.py` and paste, so the
# derivation stays auditable.
#
# ── B-1B, NOT B-1A ──────────────────────────────────────────────────────────────────────────────
# Most of the public NASA paper trail is B-1A flight test, and the two do not share an envelope:
# the B-1A had variable-geometry inlets and was flown far faster. The B-1B's FIXED inlets are the
# defining change, traded for signature. Those documents are used here for geometry and structural
# context only; every performance number is B-1B. See SOURCES.md.
#
# ── THE CALIBRATION IS THINNER THAN ANY OTHER AIRCRAFT IN THE PACK ───────────────────────────────
# The F-16A has NASA TP-1538's full tabulated aero database; the F-5E has a spin-tunnel report and
# T.O. charts; the T-38A has a published climb schedule. The B-1 has NONE of that in public. There
# is no CL(alpha, M) database, no tail geometry, no inertias, no roll-rate data. So the aerodynamics
# here are derived from published GEOMETRY by standard method (DATCOM/Helmbold/strip theory) and
# pinned by exactly one performance anchor that the engine can actually gate -- max level Mach at
# altitude. That is a weaker argument than the other three aircraft carry, and it is stated rather
# than dressed up.
#
# ── REMAINING PROVISIONAL BLOCKS, so nobody mistakes them for settled ───────────────────
#   [flight_model] ixx/iyy/izz  No published B-1 inertias exist. Radii-of-gyration estimate.
#   [aero.moments]              Tail areas and moment arms are ALL [E] -- the B-1's tail geometry
#                               is not published. Nothing in b1b.expect.toml constrains these.
#   [aero.cd_wave]              Shape is [E]; level pinned to reproduce M1.25 at 50,000 ft.
#   [engine.*_thrust]           Only SL-static ratings are published. Standard lapse x ram law.
#   cl_p / cl_da                No public B-1 roll-rate data; nothing checks these.
#   max_g_structural            Not published for the B-1B; bomber-class estimate.
#
# ── TWO ENGINE GAPS THIS AIRCRAFT FOUND, both filed, neither blocking ────────────────────────────
#   fighters-legacy#1181  [aero.limits] has no dynamic-pressure/KEAS placard, so the published
#                         low-level limit (608 kn at 200-500 ft) cannot be modelled OR gated. This
#                         model is knowingly ~11% fast below ~1,000 ft. Detail and the proof that
#                         drag cannot substitute for it: b1b.expect.toml, "NOT GATED, and why".
#   fighters-legacy#1182  validate-flight-model applies no plausibility bands to non-fighter roles
#                         at all, so nothing here is range-checked -- a unit error would pass.

[aircraft]
name        = "B-1B Lancer"
type        = "bomber"           # [P] the pack's first bomber -- and the first content anywhere to
                                 #     exercise the engine's bomber role end to end
engine_type = "turbofan"         # [P] 4x General Electric F101-GE-102, afterburning turbofan
mesh        = "b1b"              # bare stem; FolderContentPack prepends aircraft/
cockpit     = "b1b_cockpit"      # (both keys ignored after engine #813 -- EntityDef owns wiring)
has_fbw     = false              # [P] 1980s airframe with stability augmentation, NOT a FBW
                                 #     G-limiter. It can be overstressed (engine #816) -- which for
                                 #     a 2.5 g bomber matters more than it does for a fighter.
cruise_alt_m = 12000.0           # [E] high-altitude cruise leg; the low-level penetration profile
                                 #     is a mission choice, not the airframe's design cruise

# ── DERIVED by derive.py ────────────────────────────────────────────────────────────────────────
# Geometry: AR spread 9.625, AR swept 3.200 (ratio 3.007)
# MAC 4.758 m [D] from mean chord 4.338 m and taper 0.30 [E]
[flight_model]
# Geometry — [P], USAF/Boeing published dimensions (SOURCES.md).
mass_kg      = 87090             # [P] 192,000 lb operating empty
wing_area_m2 = 181.16            # [P] 1,950 ft^2 reference area
wingspan_m   = 41.758            # [P] 137 ft, wings SPREAD at 15 deg -- the reference config
mac_m        = 4.758             # [D] derive.py, from mean chord and an [E] taper
fuel_kg      = 120326            # [P] 265,274 lb usable internal
# Inertias — [E]. No B-1 inertia is published; radii-of-gyration estimate at gross weight.
ixx_kg_m2    = 7451784
iyy_kg_m2    = 10571333
izz_kg_m2    = 13313039

# ── Lift ────────────────────────────────────────────────────────────────────────────────────────
# [D] DATCOM/Helmbold swept-wing lift-curve slope at the SPREAD reference (15 deg, AR 9.63), across
# Mach. Each column rises on its derived slope to a single peak at the 13 deg stall and then drops:
# validate-flight-model requires the table peak within 2 deg of alpha_stall_deg, because the engine
# does not clamp CL -- this table IS the stall.
[aero.cl_table]
alpha  = [ -4.0,   0.0,   4.0,   8.0,  11.0,  13.0,  17.0]
mach   = [ 0.30,  0.60,  0.85,  0.95,  1.25]
values = [
    -0.2850, -0.3317, -0.3449, -0.3309, -0.2316,   # alpha -4
     0.0600,  0.0600,  0.0600,  0.0600,  0.0600,   # alpha +0
     0.4050,  0.4517,  0.4649,  0.4509,  0.3516,   # alpha +4
     0.7501,  0.8434,  0.8698,  0.8417,  0.6431,   # alpha +8
     1.0089,  1.1372,  1.1735,  1.1349,  0.8618,   # alpha +11
     1.1814,  1.3330,  1.3760,  1.3303,  1.0076,   # alpha +13
     0.9687,  1.0931,  1.1283,  1.0908,  0.8262,   # alpha +17
]

# ── Drag ────────────────────────────────────────────────────────────────────────────────────────
# cd0 is [D]: calibrated so the model reproduces M1.25 at 50,000 ft, which is the ONE max-speed
# anchor the engine can gate (see b1b.expect.toml for why the low-level anchor cannot be).
# k is [D] from the spread aspect ratio and an [E] Oswald efficiency: 1/(pi * 9.625 * 0.80).
[aero.drag_polar]
cd0           = 0.0175
k             = 0.0413
speedbrake_cd = 0.0400           # [E] the B-1 has no conventional airbrake; spoilers serve
gear_cd       = 0.0250           # [E] four-wheel bogies, large doors

# Transonic rise. Shape [E], level pinned by the 50,000 ft anchor: peaks just above M1.0 and
# settles supersonically, the standard shape for an area-ruled body.
[aero.cd_wave]
mach   = [ 0.80,  0.88,  0.92,  0.96,  1.02,  1.10,  1.25,  1.60]
values = [ 0.0000,  0.0035,  0.0090,  0.0210,  0.0330,  0.0345,  0.0380,  0.0400]

# ── Variable-sweep wing (#66 — the pack's first) ───────────────────────────────────────────────
[wing_sweep]
ref_sweep_deg   = 15.0           # [P] the base tables describe the spread planform
min_deg         = 15.0           # [P] full forward
max_deg         = 67.5           # [P] full aft
slew_rate_deg_s = 5.0            # [E] not published; a large wing takes ~10 s corner to corner

# Mach-driven auto programme [E]: spread for takeoff, landing and high-altitude cruise; aft for
# high subsonic and supersonic flight. The published usage statement, made numeric.
[wing_sweep.schedule]
mach  = [0.00, 0.50, 0.70, 0.85, 1.00, 1.25]
sweep = [15.0, 15.0, 25.0, 45.0, 60.0, 67.5]

[wing_sweep.spread]
cl_scale  = 1.000
k_scale   = 1.000
cd0_delta = +0.0000

[wing_sweep.swept]
cl_scale  = 0.666
k_scale   = 1.715
cd0_delta = -0.0020

# ── Moments ─────────────────────────────────────────────────────────────────────────────────────
# Generated by derive.py: DATCOM / strip theory from geometry. NOTHING in b1b.expect.toml
# constrains these -- no public B-1 source gives a single stability derivative, and unlike the F-5E
# there is not even a published tail area to start from. Tail areas, arms and the fin height are ALL
# [E]. These are by far the widest error bars in the model. Signs are checked: pitch and yaw stiffness
# negative/positive respectively, all damping terms negative.
[aero.moments]
cm_alpha = -2.0631
cm_q     = -22.6828
cm_de    = -1.2696
cl_beta  = -0.2857
cl_p     = -0.6834
cl_da    = +0.3740
cn_beta  = +0.1543
cn_r     = -0.1565
cn_dr    = -0.0919

[aero.limits]
alpha_stall_deg  = 13.0   # [D] the cl_table peak, by construction
max_g_structural =  2.50  # [E] NOT published for the B-1B. Bomber-class airframes run +2.0 to
                          #     +3.0 g; 2.5 is the middle of that band. With has_fbw = false there
                          #     is no limiter, so this is a real, breakable limit.
min_g_structural = -1.00  # [E] bombers carry little negative-g capability
max_mach         =  1.25  # [P] published maximum, at altitude
# [P] 608 kn at 200-500 ft, the published low-level limit -- and a DYNAMIC-PRESSURE placard, not a
# thrust limit: down there this airframe has roughly 655 kN of installed thrust against roughly
# 276 kN of drag at M0.92, so nothing aerodynamic holds it. Until fighters-legacy#1181 there was no
# way to say that, and this model trimmed to ~M1.02 -- about 11% fast in exactly the regime the
# aircraft exists for. Drag cannot substitute: a cd_wave steep enough to hold M0.92 at sea level
# walls off the transonic climb at 50,000 ft and makes the M1.25 anchor unreachable.
#
# ⚠ INERT ON ENGINE RELEASES UP TO v0.3.16, which is what pack CI fetches -- older parsers ignore
# the key (verified against the released binaries: validate clean, no unknown-key complaint, and
# the existing expectation rows still pass). It takes effect the moment a release ships #1181, and
# b1b.expect.toml then gains the low-level row it currently documents as ungateable.
max_keas         = 608.0

[aero.controls]
max_elevator_deg = 25.0   # [E] all-moving horizontal tail
max_aileron_deg  = 20.0   # [E] the B-1 rolls on spoilers plus differential tail, not ailerons;
                          #     this is the equivalent authority, not a real surface deflection
max_rudder_deg   = 25.0   # [E]

# ── Engine ──────────────────────────────────────────────────────────────────────────────────────
[engine]
fuel_flow_idle_kg_s = 0.900   # [E] four large turbofans at idle
fuel_flow_mil_kg_s  = 4.910   # [E] 69,560 lbf at ~0.56 lb/lbf/hr, a low-bypass turbofan SFC
fuel_flow_ab_kg_s   = 29.500  # [E] 123,120 lbf at ~1.9 lb/lbf/hr
spool_time_s        = 5.500   # [E] large-core turbofan; slow next to a fighter's

# Thrust vs Mach and altitude is NOT PUBLISHED -- only the SL-static ratings are. This deck is [D]:
#   T(M, h) = T_sl_static * sigma^0.85 * f(M),   f(M) = 1 - 0.20*M + 0.45*M^2
# a density lapse times ram recovery, in the low-bypass-turbofan form (F101 is BPR ~2.0). The LEVEL
# is the published static rating, not a fit. Values in kN, TOTAL for all four engines,
# row-major mach x alt_km. 15.24 km is 50,000 ft, where the max-speed anchor is measured.
[engine.mil_thrust]
mach   = [ 0.00,  0.60,  0.90,  1.25,  1.60]
alt_km = [  0.00,   5.00,  11.00,  15.24,  18.29]
values = [
     309.40,  200.68,  110.27,   62.46,   41.50,   # M 0.00
     322.39,  209.11,  114.90,   65.09,   43.25,   # M 0.60
     366.48,  237.71,  130.61,   73.99,   49.16,   # M 0.90
     428.01,  277.61,  152.54,   86.41,   57.41,   # M 1.25
     374.65,  243.00,  133.52,   75.64,   50.26,   # M 1.60
]
[engine.ab_thrust]
mach   = [ 0.00,  0.60,  0.90,  1.25,  1.60]
alt_km = [  0.00,   5.00,  11.00,  15.24,  18.29]
values = [
     547.70,  355.24,  195.19,  110.57,   73.47,   # M 0.00
     570.70,  370.16,  203.39,  115.22,   76.56,   # M 0.60
     648.75,  420.79,  231.21,  130.97,   87.02,   # M 0.90
     757.67,  491.43,  270.02,  152.96,  101.63,   # M 1.25
     663.20,  430.16,  236.36,  133.89,   88.96,   # M 1.60
]