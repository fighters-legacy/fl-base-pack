# R-27R1 semi-active radar seeker head.
#
# A RECEIVER, not an emitter: the missile rides the N019's illumination and the launch aircraft
# does the shouting. `emitter = false` with `role = "seeker"` is the pattern engine#902 added
# precisely so a seeker head is exempt from the aircraft-radar track-lobe warning — the same
# treatment aim7m_seeker carries.
#
# The head is deliberately shorter-legged than the missile's 22 nm employment range: what limits
# a SARH shot is the shooter holding the lock, not the seeker, and the N019's 19 nm track is the
# real constraint (sensors/n019.toml explains why that number is what it is).
[sensor]
id              = "fl-base:r27r1_seeker"
name            = "R-27R1 SARH seeker"
type            = "radar"
role            = "seeker"
omnidirectional = false
emitter         = false    # receives reflections only

[search]
az_half_angle_deg = 25.0   # [E] gimbal limits, acquisition basket
el_half_angle_deg = 25.0
min_range_nm      = 0.3
max_range_nm      = 15.0   # [E] comparable to the AIM-7M seeker's 14 nm; the R-27's larger
                           #     airframe carries a slightly bigger antenna
pod               = 0.50

[track]
az_half_angle_deg = 20.0
el_half_angle_deg = 20.0
min_range_nm      = 0.2
max_range_nm      = 13.0   # track <= search in every axis
pod               = 0.85
lock_hold_s       = 1.5    # [E] brief memory through an illumination fade, then it goes dumb
