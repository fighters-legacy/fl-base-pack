version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Contributors to fl-base-pack"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated audio — CC0 rather than the pack default.
#
# The radio voice lines (#13) and the music tracks (#5) are the only model-generated assets in this
# pack, shipped under the AI content policy's audio exception (decision record 2026-08-17,
# fighters-legacy/fighters-legacy#1200). The exception REQUIRES this annotation: a purely
# model-generated work carries no copyright the project can assert, so the `**` rule above would put
# a false CC-BY-4.0 claim on it, and a false licence claim is worse than the thing it papers over.
#
# Annotated by path rather than with 48 `.license` sidecars: one rule covering the generated
# directories is auditable at a glance, where 48 sidecars are 48 chances to miss one. Provenance
# (models, prompts, seeds) is in audio/radio/SOURCES.md and audio/music/SOURCES.md.
[[annotations]]
path = ["audio/radio/**.ogg", "audio/music/**.ogg"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Terrain tiles (#2) — derived works of third-party geodata, NOT pack-copyright content: the `**`
# default above would put a false claim on them. Two annotations because the two layers derive
# from different sources under different licences; the land-cover rule comes second so it wins for
# `*_lc.png` under REUSE.toml's last-match precedence. Attribution + provenance:
# terrain/ATTRIBUTION.md (both sources REQUIRE the notice to travel with the data).
[[annotations]]
path = "terrain/world/**"
SPDX-FileCopyrightText = "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
SPDX-License-Identifier = "LicenseRef-Copernicus-DEM"

[[annotations]]
path = "terrain/world/**_lc.png"
SPDX-FileCopyrightText = "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by the ESA WorldCover consortium"
SPDX-License-Identifier = "CC-BY-4.0"

# Vendored three.js (tools/gltf-inspect) — a third party's MIT-licensed work, not pack content.
# It is committed rather than fetched so the stopgap viewer works offline with no build step.
# Pinned to r160; to update, re-download the same file set at a new tag and keep this annotation.
[[annotations]]
path = "tools/gltf-inspect/vendor/**"
SPDX-FileCopyrightText = "2010-2023 Three.js Authors"
SPDX-License-Identifier = "MIT"
